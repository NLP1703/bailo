server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA : toutes les routes retombent sur index.html (le service worker gère le cache).
  location / {
    try_files $uri /index.html;
  }

  # Ne pas mettre en cache le service worker ni le manifeste.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
}
