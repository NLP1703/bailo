server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy same-origin vers l'API (/api/...). Généré au démarrage par
  # /docker-entrypoint.d/40-bailo-api-proxy.sh ; absent si aucune API n'est configurée.
  # Servir l'API sur le domaine du site rend le cookie de session « first-party » :
  # Safari/iOS et Firefox ne le bloquent pas (sécurité 1.2).
  include /etc/nginx/bailo/*.inc;

  # SPA : toutes les routes retombent sur index.html (le service worker gère le cache).
  location / {
    try_files $uri /index.html;
  }

  # Ne pas mettre en cache le service worker ni le manifeste.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
}
