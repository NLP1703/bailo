# Référencement : seules les pages publiques sont indexables. Les écrans privés
# (connexion, application, vérification de reçu…) et les adresses inconnues sont
# servis avec « X-Robots-Tag: noindex » — Google ne les affiche pas dans ses résultats.
# Une valeur vide n'envoie pas l'en-tête.
map $request_uri $bailo_robots {
  default                                  "noindex, nofollow";
  "~^/(\?.*)?$"                            "";
  "~^/privacy/?(\?.*)?$"                   "";
  "~^/(assets|images)/"                    "";
  "~^/(robots\.txt|sitemap\.xml|og-image\.jpg|icon\.svg|manifest\.webmanifest)" "";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Robots-Tag $bailo_robots always;

  # Proxy same-origin vers l'API (/api/...). Généré au démarrage par
  # /docker-entrypoint.d/40-bailo-api-proxy.sh ; absent si aucune API n'est configurée.
  # Servir l'API sur le domaine du site rend le cookie de session « first-party » :
  # Safari/iOS et Firefox ne le bloquent pas (sécurité 1.2).
  include /etc/nginx/bailo/*.inc;

  # SPA : toutes les routes retombent sur index.html (le service worker gère le cache).
  location / {
    try_files $uri /index.html;
  }

  # Fichiers de référencement générés au démarrage : jamais remplacés par la SPA.
  location = /robots.txt {
    default_type text/plain;
    try_files /robots.txt =404;
  }
  location = /sitemap.xml {
    default_type application/xml;
    try_files /sitemap.xml =404;
  }

  # Ne pas mettre en cache le service worker ni le manifeste.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag $bailo_robots always;
  }
}
