# CitéGest — pile de développement / production légère (un seul VPS).
# Démarrage : cp .env.example .env && docker compose up --build
#
# Le service `web` (front React/PWA) est ajouté au Lot 4, quand apps/web a des sources.

name: citegest

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: citegest
      POSTGRES_PASSWORD: citegest
      POSTGRES_DB: citegest
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U citegest -d citegest']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '9000:9000'
      - '9001:9001'

  # Crée le bucket applicatif au démarrage puis s'arrête.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-citegest} &&
      echo 'Bucket prêt';
      "
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3000
      TZ: Africa/Douala
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      DATABASE_URL: postgresql://citegest:citegest@postgres:5432/citegest?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?secret requis}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?secret requis}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      ENABLE_JOBS: ${ENABLE_JOBS:-true}
      JOBS_CRON: ${JOBS_CRON:-0 2 * * *}
      PUBLIC_RECEIPT_BASE: ${PUBLIC_RECEIPT_BASE:-http://localhost/r}
      # L'API ne fait que SIGNER les URLs ; c'est le navigateur qui transfère les fichiers.
      # S3_ENDPOINT doit donc être joignable PAR LE NAVIGATEUR (pas l'hôte interne minio:9000).
      # En dev : le port 9000 publié ci-dessus. En prod : un sous-domaine public vers MinIO.
      S3_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      # Endpoint joignable par le CONTENEUR API (logo inliné sur les reçus PDF).
      S3_INTERNAL_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-citegest}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    expose:
      - '3000'
    ports:
      - '3000:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_PUBLIC_RECEIPT_BASE: /r
    depends_on:
      - api
    expose:
      - '80'

  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
      - web
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    ports:
      - '80:80'
      - '443:443'

volumes:
  pgdata:
  miniodata:
  caddydata:
  caddyconfig:
